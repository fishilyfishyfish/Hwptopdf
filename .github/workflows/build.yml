name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Fetch engine and fonts
        run: bash tools/fetch-assets.sh

      - name: Build APK
        run: gradle assembleDebug --no-daemon

      - name: Keep the APK for this run
        uses: actions/upload-artifact@v4
        with:
          name: hwptopdf-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to the release page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk hwptopdf.apk
          gh release view latest >/dev/null 2>&1 || \
            gh release create latest --title "HWP → PDF" --notes "태블릿에서 hwptopdf.apk를 받아 설치하세요."
          gh release upload latest hwptopdf.apk --clobber

  # Takes about ten minutes, so it only runs when started by hand.
  e2e:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hwptopdf-apk

      - name: Prepare test documents
        run: |
          mv app-debug.apk hwptopdf.apk
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf
          mkdir samples
          BASE=https://raw.githubusercontent.com/edwardkim/rhwp/c9095c5f67632e6721e800ccc7fb43ea49d26682/samples
          curl -fsSL -o samples/exam_math.hwp "$BASE/exam_math.hwp"
          curl -fsSL -o samples/sample.hwpx "$BASE/SO-SUEOP.hwpx"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Convert on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash e2e/run.sh

      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-output
          path: e2e-output
