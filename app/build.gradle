plugins {
    id 'com.android.application'
}

android {
    namespace 'io.github.fishy.hwptopdf'
    compileSdk 35

    defaultConfig {
        applicationId "io.github.fishy.hwptopdf"
        minSdk 29
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    // One fixed key, so a newer APK installs over the old one.
    signingConfigs {
        debug {
            storeFile file('signing.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}
